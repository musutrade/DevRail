[package]
name = "arc-admin-backend"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "arc-admin-backend"

[lints.clippy]
allow_attributes = "deny"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
getrandom = "0.4"
ipnet = "2"
libc = "0.2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
minijinja = { version = "2.12", default-features = false, features = ["serde"] }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
hmac = "0.12"
hex = "0.4"
sha2_legacy = { package = "sha2", version = "0.10" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json", "uuid"] }
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3"
futures-core = "0.3"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth", "qr"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "cors", "request-id", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["chrono"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
web-push = "0.11"

[dev-dependencies]
http-body-util = "0.1"
