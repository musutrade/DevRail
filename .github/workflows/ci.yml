name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'AGENTS.md'
            frontend:
              - 'frontend/**'
              - 'backend/src/openapi.rs'
              - 'backend/src/models.rs'
              - 'docs/openapi.json'
              - 'AGENTS.md'
            workflow:
              - 'codex-audit-pipeline/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'AGENTS.md'

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true
          cache-key: v1-workflow-${{ hashFiles('codex-audit-pipeline/tools/arc-flow/Cargo.lock', 'rust-toolchain.toml') }}
          cache-workspaces: codex-audit-pipeline/tools/arc-flow -> codex-audit-pipeline/tools/arc-flow/target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify development workflow
        run: cargo flow verify --components workflow
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: codex-audit-pipeline/.codex/reports/
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend verification
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: arc_admin_test
          POSTGRES_PASSWORD: arc_admin_test
          POSTGRES_DB: arc_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arc_admin_test -d arc_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true
          cache-key: v1-backend-${{ hashFiles('backend/Cargo.lock', 'rust-toolchain.toml') }}
          cache-workspaces: backend -> backend/target
      - name: Run backend checks and tests
        env:
          TEST_DATABASE_URL: postgres://arc_admin_test:arc_admin_test@127.0.0.1:5432/arc_admin_test
        run: cargo flow verify --components backend
      - name: Upload backend report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-report
          path: codex-audit-pipeline/.codex/reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend verification
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: arc_admin_test
          POSTGRES_PASSWORD: arc_admin_test
          POSTGRES_DB: arc_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arc_admin_test -d arc_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true
          cache-key: v1-frontend-workflow-${{ hashFiles('codex-audit-pipeline/tools/arc-flow/Cargo.lock', 'rust-toolchain.toml') }}
          cache-workspaces: codex-audit-pipeline/tools/arc-flow -> codex-audit-pipeline/tools/arc-flow/target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Prepare Doctor prerequisites
        run: |
          cp backend/.env.example backend/.env
          git config core.hooksPath codex-audit-pipeline/hooks
          mkdir -p codex-audit-pipeline/.codex/reports
      - name: Verify CI environment
        env:
          TEST_DATABASE_URL: postgres://arc_admin_test:arc_admin_test@127.0.0.1:5432/arc_admin_test
        run: |
          set -o pipefail
          cargo flow doctor --strict --json | tee codex-audit-pipeline/.codex/reports/doctor.json
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run frontend checks and tests
        env:
          TEST_DATABASE_URL: postgres://arc_admin_test:arc_admin_test@127.0.0.1:5432/arc_admin_test
        run: cargo flow verify --components frontend
      - name: Upload frontend report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-report
          path: codex-audit-pipeline/.codex/reports/
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
