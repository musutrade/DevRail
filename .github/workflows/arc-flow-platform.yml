name: arc-flow platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: arc-flow-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect arc-flow scope
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - 'codex-audit-pipeline/**'
              - 'scripts/**'
              - '.github/workflows/arc-flow-platform.yml'
              - 'AGENTS.md'

  test:
    name: arc-flow ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true
          cache-key: v1-arc-flow-${{ hashFiles('codex-audit-pipeline/tools/arc-flow/Cargo.lock', 'rust-toolchain.toml') }}
          cache-workspaces: codex-audit-pipeline/tools/arc-flow -> codex-audit-pipeline/tools/arc-flow/target
      - name: Rust format
        run: cargo fmt --manifest-path codex-audit-pipeline/tools/arc-flow/Cargo.toml -- --check
      - name: Rust Clippy
        run: cargo clippy --manifest-path codex-audit-pipeline/tools/arc-flow/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path codex-audit-pipeline/tools/arc-flow/Cargo.toml --locked

  benchmark:
    name: arc-flow benchmark
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true
          cache-key: v1-arc-flow-${{ hashFiles('codex-audit-pipeline/tools/arc-flow/Cargo.lock', 'rust-toolchain.toml') }}
          cache-workspaces: codex-audit-pipeline/tools/arc-flow -> codex-audit-pipeline/tools/arc-flow/target
      - name: Run 10,000-file benchmark
        env:
          ARC_FLOW_BENCH_FILES: 10000
          ARC_FLOW_BENCH_MAX_MS: 30000
          ARC_FLOW_BENCH_MAX_RSS_MB: 512
          ARC_FLOW_BENCH_THREADS: 4
          ARC_FLOW_BENCH_OUTPUT: dist/arc-flow-release/benchmark.json
        run: node scripts/benchmark-audit.mjs
      - name: Build release binary
        run: cargo build --release --locked --manifest-path codex-audit-pipeline/tools/arc-flow/Cargo.toml
      - name: Generate SPDX SBOM and SHA-256 checksum
        run: node scripts/generate-arc-flow-sbom.mjs dist/arc-flow-release codex-audit-pipeline/tools/arc-flow/target/release/arc-flow
      - name: Upload arc-flow release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arc-flow-release-evidence
          path: |
            dist/arc-flow-release/
            codex-audit-pipeline/tools/arc-flow/target/release/arc-flow
            codex-audit-pipeline/tools/arc-flow/target/release/arc-flow.sha256
          if-no-files-found: error
          retention-days: 30
