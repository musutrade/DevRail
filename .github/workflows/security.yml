name: Supply chain security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect security scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            images:
              - 'backend/**'
              - 'frontend/**'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'docker/**'

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true
          cache-key: v1-backend-${{ hashFiles('backend/Cargo.lock', 'rust-toolchain.toml') }}
          cache-workspaces: backend -> backend/target
      - name: Audit RustSec advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend
          # SQLx keeps its inactive MySQL driver in Cargo.lock; the backend only enables PostgreSQL.
          ignore: RUSTSEC-2023-0071
      - name: Check licenses, sources, duplicates, and advisories
        if: always()
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        env:
          # The action runs in Alpine with this musl toolchain preinstalled.
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-musl
        with:
          manifest-path: backend/Cargo.toml
          command: check
          command-arguments: advisories bans licenses sources

  container-images:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.images == 'true'
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: arc-admin-backend:ci
            dockerfile: backend/Dockerfile
            artifact: arc-admin-backend.spdx.json
            cache_scope: backend-image
          - image: arc-admin-frontend:ci
            dockerfile: frontend/Dockerfile
            artifact: arc-admin-frontend.spdx.json
            cache_scope: frontend-image
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}
          load: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
      - name: Scan high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Generate SPDX JSON SBOM
        if: ${{ always() && steps.build-image.outcome == 'success' }}
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          output-file: ${{ matrix.artifact }}
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 30
