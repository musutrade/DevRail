name: Supply chain security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect security scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deny.toml'
              - '.github/workflows/security.yml'
              - 'rust-toolchain.toml'
            images:
              - 'backend/**'
              - 'frontend/**'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'deployment/nginx/**'
              - 'compose.production.yaml'

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify time-bounded advisory acceptances
        run: node scripts/check-risk-acceptances.mjs
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true
          cache-key: v1-backend-${{ hashFiles('backend/Cargo.lock', 'rust-toolchain.toml') }}
          cache-workspaces: backend -> backend/target
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked --force
      - name: Audit RustSec advisories
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend
          # Temporary, owner-reviewed risk acceptance expires 2026-12-31.
          # The exact dependency path and compensating controls are documented
          # in docs/security/rustsec-2023-0071-risk-acceptance-2026-09.md.
          ignore: RUSTSEC-2023-0071
      - name: Check licenses, sources, duplicates, and advisories
        if: always()
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        env:
          # The action runs in Alpine with this musl toolchain preinstalled.
          RUSTUP_TOOLCHAIN: 1.85.0-x86_64-unknown-linux-musl
        with:
          manifest-path: backend/Cargo.toml
          command: check
          command-arguments: advisories bans licenses sources

  container-images:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true'
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: arc-admin-backend:ci
            dockerfile: backend/Dockerfile
            artifact: arc-admin-backend.spdx.json
            cache_scope: backend-image
          - image: arc-admin-frontend:ci
            dockerfile: frontend/Dockerfile
            artifact: arc-admin-frontend.spdx.json
            cache_scope: frontend-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        id: build-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}
          load: true
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
      - name: Scan high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Generate SPDX JSON SBOM
        if: ${{ always() && steps.build-image.outcome == 'success' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          output-file: ${{ matrix.artifact }}
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 30
