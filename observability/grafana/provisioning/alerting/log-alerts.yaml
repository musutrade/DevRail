apiVersion: 1

groups:
  - orgId: 1
    name: 应用日志告警
    folder: 系统可观测性
    interval: 1m
    rules:
      - uid: application-error-burst
        title: 应用错误日志突增
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({service_name=~".+", level="ERROR"}[5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: application-logs
        panelId: 1
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: 最近 5 分钟 ERROR 日志持续超过 5 条，请按 trace_id 定位根因。
          summary: 应用错误日志突增
        labels:
          severity: warning
        isPaused: false

      - uid: application-http-5xx
        title: HTTP 5xx 持续出现
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({service_name=~".+"} | status_code >= 500 [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: application-logs
        panelId: 2
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          description: 最近 5 分钟 HTTP 5xx 持续超过 3 条，请检查对应请求追踪号。
          summary: HTTP 5xx 持续出现
        labels:
          severity: critical
        isPaused: false
