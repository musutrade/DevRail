apiVersion: 1

groups:
  - orgId: 1
    name: 应用指标告警
    folder: 系统可观测性
    interval: 1m
    rules:
      - uid: application-entry-down
        title: 应用入口不可用
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'min(probe_success{job="arc-admin-entry-probe"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: application-metrics
        panelId: 4
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          description: Blackbox 连续两分钟无法访问应用入口，请检查前端、反向代理和宿主机网络。
          summary: 应用入口不可用
        labels:
          severity: critical
        isPaused: false
      - uid: devrail-push-backlog
        title: DevRail 推送积压
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: 'max(devrail_push_delivery_backlog)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, refId: B, type: reduce}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [100], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {description: DevRail Web Push 待处理投递超过 100 条并持续五分钟。}
        labels: {severity: warning}
        isPaused: false
      - uid: devrail-push-failures
        title: DevRail 推送失败率升高
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: 'sum(rate(devrail_push_delivery_total{outcome=~"retrying|invalid"}[10m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, refId: B, type: reduce}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {description: DevRail Web Push 在最近十分钟持续出现临时或永久失败。}
        labels: {severity: warning}
        isPaused: false
      - uid: devrail-push-invalid-devices
        title: DevRail 推送设备永久失效
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: 'max(devrail_push_invalid_devices)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, refId: B, type: reduce}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {description: DevRail 存在永久失败的 Web Push 设备，请检查设备状态并通知用户重新注册。}
        labels: {severity: warning}
        isPaused: false
