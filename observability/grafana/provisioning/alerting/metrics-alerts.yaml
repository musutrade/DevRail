apiVersion: 1

groups:
  - orgId: 1
    name: 应用指标告警
    folder: 系统可观测性
    interval: 1m
    rules:
      - uid: application-entry-down
        title: 应用入口不可用
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'min(probe_success{job="arc-admin-entry-probe"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: application-metrics
        panelId: 4
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          description: Blackbox 连续两分钟无法访问应用入口，请检查前端、反向代理和宿主机网络。
          summary: 应用入口不可用
        labels:
          severity: critical
        isPaused: false
