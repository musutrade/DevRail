<div class="page notification-settings-page">
  <div class="page-header">
    <div>
      <h1>DevRail 通知设置</h1>
      <p>管理站内通知类别和推送意向。</p>
    </div>
  </div>
  @if (loading()) {
    <div class="loading-wrap" role="status">正在加载设置</div>
  } @else {
    <form class="settings-form" (ngSubmit)="save()">
      <label class="check-row"
        ><input type="checkbox" name="inAppEnabled" [(ngModel)]="inAppEnabled" />启用站内通知</label
      >
      <label class="check-row disabled-row"
        ><input type="checkbox" name="pushEnabled" [ngModel]="false" disabled />启用 Web
        Push（设备注册尚未完成）</label
      >
      <label
        >通知类型（逗号分隔）<textarea
          name="eventTypes"
          rows="5"
          [(ngModel)]="eventTypes"
        ></textarea>
      </label>
      <button class="row-btn primary-btn" type="submit" [disabled]="saving()">
        <mat-icon>save</mat-icon><span>{{ saving() ? '保存中' : '保存设置' }}</span>
      </button>
      @if (saved()) {
        <span class="saved" role="status">设置已保存</span>
      }
      @if (error()) {
        <div class="empty-state" role="alert">{{ error() }}</div>
      }
    </form>
  }
</div>
