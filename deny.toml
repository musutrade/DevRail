[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Temporary risk acceptance through 2026-12-31; the reachable path is web-push -> jwt-simple -> superboring -> rsa, no upstream patch exists, Web Push is disabled unless all VAPID settings are present, and the dependency must be re-evaluated before expiry (docs/security/rustsec-2023-0071-risk-acceptance-2026-09.md)." },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
allow-git = []
